<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réinitialisation échouée</title>

<style>
    :root {
        --primary: hsl(262, 60%, 20%);
        --secondary: hsl(248, 40%, 45%);
        --primaryBlur: hsla(262, 77%, 20%, 0.3);
        --secondaryBlur: hsla(248, 40%, 45%, 0.3);
        --background: hsl(0, 0%, 0%);
        --textPrimary: hsl(0, 0%, 95%);
        --textSecondary: hsl(0, 0%, 65%);
        --erreur: hsl(0, 100%, 40%); 
        --erreurBlur: hsla(0, 100%, 40%, 0.4);
    }

    body {
        margin: 24;
        padding: 0;
        background: var(--primary);
        font-family: system-ui, sans-serif;
        color: var(--textPrimary);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: var(--secondaryBlur);
        padding: 2.5rem 3rem;
        border-radius: 18px;
        box-shadow: 0 0 18px var(--secondary);
        text-align: center;
        max-width: 420px;
        border: 1px solid var(--textSecondary);
        animation: fadeIn 0.6s ease-out;
    }

    h1 {
        margin-top: 0;
        font-size: 1.8rem;
        font-weight: 600;
        color: var(--erreur);
        text-shadow: 0 0 12px var(--erreurBlur);
    }

    p {
        color: var(--textSecondary);
        font-size: 1rem;
        margin-bottom: 0;
        line-height: 1.6;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>
    <div class="card">
        <h1>réinitialisation de mot de passe échouée</h1>
        <p>un problème est survenu...</p>
        <p>tu peux me contacter sur instagram!</p>
    </div>
</body>
</html>
